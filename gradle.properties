# Gradle settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared versions for every Quasar MC mod.
# Change these in ONE place when moving to a new Minecraft / NeoForge version.
# Latest NeoForge builds: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.3
minecraft_version_range=[26.3]
# Pinned to the same build as the MultiMC test instance. NeoForge 26.3 is still beta,
# so only bump this on purpose.
neo_version=26.3.0.115

# Shared mod metadata
mod_license=All Rights Reserved
mod_authors=KrisKreemurr
mod_group_id=io.github.kriskreemurr.quasarmc

# Each mod's own id, name, version and description live in <mod folder>/gradle.properties

# Where built mod jars get copied after every build (your MultiMC test instance).
# Anyone else can override this in their own %USERPROFILE%\.gradle\gradle.properties
quasarmc_test_mods_dir=G:/MultiMC/instances/26.3/.minecraft/mods