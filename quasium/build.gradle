plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
}

// Shared setup comes from the root build.gradle.

// Core must be configured first so we can reference its source set below.
evaluationDependsOn(':core')

dependencies {
    // Shared dynamic-light rules live in Core.
    implementation project(':core')
}

neoForge {
    mods {
        quasarmc_core {
            sourceSet(project(':core').sourceSets.main)
        }
    }
}
